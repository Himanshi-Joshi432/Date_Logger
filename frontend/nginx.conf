# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name date-logger.singlehq.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name date-logger.singlehq.me;

    ssl_certificate /etc/letsencrypt/live/date-logger.singlehq.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/date-logger.singlehq.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Image upload size limit
    client_max_body_size 15M;

    # React Router SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy health check
    location /intro {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
