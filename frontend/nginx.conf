# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    server_name date-logger.singlehq.me;

    # Webroot for certbot renewals (mounted from the host in docker-compose.yml)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name date-logger.singlehq.me;

    ssl_certificate /etc/letsencrypt/live/date-logger.singlehq.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/date-logger.singlehq.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;

    # Security headers (inherited by every location below that doesn't set its own add_header)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upload size limit: up to 15 photos + 1 soundtrack per date log.
    # Per-file limits are enforced by the backend (multer, 15 MB each).
    client_max_body_size 100M;

    # React Router SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Large photo uploads are forwarded to ImageKit before the backend replies
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # Proxy health check
    location = /intro {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
