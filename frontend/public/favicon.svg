<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich terracotta wax seal gradients -->
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#b6503e"/>
      <stop offset="45%" stop-color="#8d3d2f"/>
      <stop offset="85%" stop-color="#6e261a"/>
      <stop offset="100%" stop-color="#541b12"/>
    </radialGradient>
    <radialGradient id="innerWax" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#9a4334"/>
      <stop offset="70%" stop-color="#7d3225"/>
      <stop offset="100%" stop-color="#602217"/>
    </radialGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cccccc"/>
      <stop offset="70%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
    <filter id="sealShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#2a1f18" flood-opacity="0.35"/>
    </filter>
    <filter id="clipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#1e1510" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Wax Seal Outer Organic Silhouette -->
  <g filter="url(#sealShadow)">
    <path d="M64 8
             C75 7, 84 11, 92 18
             C100 25, 108 30, 114 39
             C120 48, 121 58, 120 68
             C119 78, 115 88, 108 96
             C101 104, 92 112, 82 117
             C72 121, 61 121, 50 119
             C39 117, 29 111, 21 103
             C13 95, 8 85, 7 74
             C6 63, 9 52, 15 43
             C21 34, 30 26, 39 19
             C48 12, 56 9, 64 8 Z"
          fill="url(#waxGrad)" />
    
    <!-- Inner Pressed Wax Circle -->
    <circle cx="64" cy="65" r="43" fill="url(#innerWax)" stroke="#521c13" stroke-width="2.5" />
    
    <!-- Vintage Dotted Stamped Rim -->
    <circle cx="64" cy="65" r="37.5" fill="none" stroke="#e8d5be" stroke-width="1.8" stroke-dasharray="3.5,3" opacity="0.85" />
  </g>

  <!-- Centerpiece: Ivory Parchment Heart -->
  <!-- Heart Shadow -->
  <path d="M64 88
           C64 88, 38 71, 38 52
           C38 42, 45 35, 55 35
           C60 35, 63 38, 64 41
           C65 38, 68 35, 73 35
           C83 35, 90 42, 90 52
           C90 71, 64 88, 64 88 Z"
        fill="#3d140e" opacity="0.3" transform="translate(1, 2)" />

  <!-- Heart Body -->
  <path d="M64 87
           C64 87, 38 70, 38 51
           C38 41, 45 34, 55 34
           C60 34, 63 37, 64 40
           C65 37, 68 34, 73 34
           C83 34, 90 41, 90 51
           C90 70, 64 87, 64 87 Z"
        fill="#fdfaf4" stroke="#d4be9b" stroke-width="2" />

  <!-- Engraved Center Memory Ribbon / Floral Detail -->
  <!-- Crossbars / Journal Emblem -->
  <path d="M64 47 L64 68 M56 57 L72 57" stroke="#8d3d2f" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="64" cy="74" r="2.2" fill="#8d3d2f" opacity="0.85" />

  <!-- Vintage Wire Paperclip (Clipping the top-right edge) -->
  <g filter="url(#clipShadow)">
    <path d="M86 10 
             L102 38 
             C105 44, 100 50, 94 50 
             C88 50, 84 45, 81 39 
             L72 22 
             C70 17, 74 13, 78 13 
             C82 13, 85 16, 87 20 
             L95 36"
          fill="none" 
          stroke="url(#clipGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
