services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: date_logger_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - date_logger_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: date_logger_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - date_logger_net

networks:
  date_logger_net:
    driver: bridge
